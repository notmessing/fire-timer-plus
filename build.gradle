plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.20'
	annotationProcessor 'org.projectlombok:lombok:1.18.20'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.firetimer'
version = '1.0.0'
sourceCompatibility = '11'
targetCompatibility = '11'

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}

// Launches a dev RuneLite with Fire Timer Plus pre-loaded. Passes
// --developer-mode so the client reads ~/.runelite/credentials.properties.
// For Jagex-account login, follow the wiki's Jagex Launcher Development
// workflow: run the official RuneLite once with the launcher argument
// --insecure-write-credentials to populate that credentials file, then
// re-run this task. See https://github.com/runelite/runelite/wiki/Jagex-Launcher-Development
task runClient(type: JavaExec) {
	group = 'application'
	description = 'Launch a dev RuneLite with Fire Timer Plus pre-loaded.'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.firetimer.FireTimerPluginTest'
	jvmArgs '-ea'
	args '--developer-mode'
}

// Builds the plugin JAR and copies it to ~/.runelite/sideloaded-plugins so
// the official Jagex-launched RuneLite picks it up on next start.
task sideloadInstall(type: Copy) {
	dependsOn jar
	group = 'application'
	description = 'Build and install the plugin JAR to ~/.runelite/sideloaded-plugins.'
	from jar.archiveFile
	into "${System.getProperty('user.home')}/.runelite/sideloaded-plugins"
}
