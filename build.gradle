plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.20'
	annotationProcessor 'org.projectlombok:lombok:1.18.20'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.firetimer'
version = '1.0.0'
sourceCompatibility = '11'
targetCompatibility = '11'

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}

task runClient(type: JavaExec) {
	group = 'application'
	description = 'Launch a dev RuneLite with Fire Timer Plus loaded (legacy-account login only; Jagex accounts must use sideloadInstall + Jagex Launcher).'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.firetimer.FireTimerPluginTest'
	jvmArgs '-ea'
}

task sideloadInstall(type: Copy) {
	dependsOn jar
	group = 'application'
	description = 'Build the plugin JAR and copy it into ~/.runelite/sideloaded-plugins for use with the Jagex Launcher.'
	from jar.archiveFile
	into "${System.getProperty('user.home')}/.runelite/sideloaded-plugins"
}
